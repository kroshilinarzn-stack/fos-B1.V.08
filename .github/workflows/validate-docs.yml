name: Docs Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-check-links codespell
        
    - name: Run repository structure and content tests
      run: |
        pytest tests/ -v --tb=short

    - name: Check links (safe mode)
      run: |
        # Проверяем только относительные (внутренние) ссылки, игнорируя внешние http/https
        pytest --check-links tests/ README.md --check-links-ignore "https?://.*"

    - name: Codespell
      run: |
        codespell --skip=".git,*.pyc,__pycache__,*.svg" --ignore-words-list="ist,ot"
